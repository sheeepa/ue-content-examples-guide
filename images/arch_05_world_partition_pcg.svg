<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1168" height="448" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="54" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">次世代开放世界工程：World Partition 空间流送 × Data Layers × PCG 管线</text>
  <text x="40" y="80" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">彻底告别多人协作抢锁同一张 .umap 的旧时代</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="120" width="360" height="320" rx="10" fill="#1e293b" fill-opacity="0.92" stroke="#ec4899" stroke-width="1.8"/>
  <rect x="40" y="120" width="360" height="32" rx="10" fill="#ec4899" fill-opacity="0.18"/>
  <text x="54" y="142" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">World Partition + OFPA</text>
  <text x="388" y="141" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ec4899">空间流送</text>
  <text x="54" y="174" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• One File Per Actor (OFPA)：</text>
  <text x="54" y="195" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  每个 Actor 独立存盘于 __ExternalActors__，</text>
  <text x="54" y="216" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  百人团队同时编辑同一片大陆互不冲突！</text>
  <text x="54" y="237" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 2D 空间哈希运行时网格 (Runtime Grid)：</text>
  <text x="54" y="258" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  依据 Streaming Source（玩家/摄像机）距离</text>
  <text x="54" y="279" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  自动加载近处精细格、远处自动切换 HLOD。</text>
  <line x1="405" y1="280" x2="425" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="430" y="120" width="350" height="320" rx="10" fill="#1e293b" fill-opacity="0.92" stroke="#818cf8" stroke-width="1.8"/>
  <rect x="430" y="120" width="350" height="32" rx="10" fill="#818cf8" fill-opacity="0.18"/>
  <text x="444" y="142" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">Data Layers 动态世界图层</text>
  <text x="768" y="141" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#818cf8">状态切换</text>
  <text x="444" y="174" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 正交于空间网格的“平行维度开关”：</text>
  <text x="444" y="195" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  同一地理坐标可叠加【战前繁荣小镇】与</text>
  <text x="444" y="216" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  【战后废墟】两个 Runtime Data Layer。</text>
  <text x="444" y="237" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 三态生命周期：</text>
  <text x="444" y="258" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  Unloaded（未驻留内存）→ Loaded（预热内存</text>
  <text x="444" y="279" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  隐藏）→ Activated（瞬间零卡顿显现）！</text>
  <line x1="785" y1="280" x2="805" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="810" y="120" width="350" height="320" rx="10" fill="#1e293b" fill-opacity="0.92" stroke="#10b981" stroke-width="1.8"/>
  <rect x="810" y="120" width="350" height="32" rx="10" fill="#10b981" fill-opacity="0.18"/>
  <text x="824" y="142" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">PCG 程序化点云算子管线</text>
  <text x="1148" y="141" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#10b981">规则生成</text>
  <text x="824" y="174" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 核心抽象：带变换、包围盒与 Density [0,1]</text>
  <text x="824" y="195" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  权重的空间点云流 (PCG Point Data)！</text>
  <text x="824" y="216" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• Surface/Spline Sampler 采样地形与道路</text>
  <text x="824" y="237" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  ──► Difference 挖空道路/建筑占地包围盒</text>
  <text x="824" y="258" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  ──► Density Noise & Normal Filter 坡度过滤</text>
  <text x="824" y="279" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  ──► Static Mesh Spawner 实例化海量植被岩石</text>

</svg>

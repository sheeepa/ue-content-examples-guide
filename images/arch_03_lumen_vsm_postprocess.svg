<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1168" height="448" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="54" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">UE5 实时电影级光影管线：Lumen 混合追踪 × VSM 虚拟阴影 × ACES 后处理</text>
  <text x="40" y="80" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">Lighting_Realtime 与 Level_PostProcessing 两张核心地图的底层渲染数据流</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="125" width="355" height="315" rx="10" fill="#1e293b" fill-opacity="0.92" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="40" y="125" width="355" height="32" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <text x="54" y="147" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">1. 直接光照与 VSM 虚拟阴影</text>
  <text x="383" y="146" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">直接光阶段</text>
  <text x="54" y="179" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 光源机动性：Static / Stationary / Movable</text>
  <text x="54" y="200" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• Virtual Shadow Maps (VSM)：</text>
  <text x="54" y="221" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  16k×16k 虚拟纹素分页池，仅光栅化屏幕</text>
  <text x="54" y="242" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  可见像素对应的物理 128×128 页表！</text>
  <text x="54" y="263" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 与 Nanite 深度协同，按需缓存静态页面，</text>
  <text x="54" y="284" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  消除传统级联阴影 CSM 远近切换闪烁。</text>
  <line x1="400" y1="280" x2="420" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="425" y="125" width="365" height="315" rx="10" fill="#1e293b" fill-opacity="0.92" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="425" y="125" width="365" height="32" rx="10" fill="#38bdf8" fill-opacity="0.18"/>
  <text x="439" y="147" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">2. Lumen 全局光照与反射 (GI)</text>
  <text x="778" y="146" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">间接光阶段</text>
  <text x="439" y="179" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• Surface Cache (表面缓存)：离线/动态把网格</text>
  <text x="439" y="200" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  6向属性卡片化，免去命中时重跑复杂材质！</text>
  <text x="439" y="221" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 三级接力光线追踪：</text>
  <text x="439" y="242" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  ① 屏幕空间追踪 (Screen Traces, 极近细节)</text>
  <text x="439" y="263" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  ② 软件追踪 (Mesh SDF → Global SDF)</text>
  <text x="439" y="284" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  ③ 硬件光线追踪 (Hardware RT, 高精度反射)</text>
  <text x="439" y="305" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• Radiance Cache 辐射度探针实现无限次反弹。</text>
  <line x1="795" y1="280" x2="815" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="820" y="125" width="340" height="315" rx="10" fill="#1e293b" fill-opacity="0.92" stroke="#a855f7" stroke-width="1.8"/>
  <rect x="820" y="125" width="340" height="32" rx="10" fill="#a855f7" fill-opacity="0.18"/>
  <text x="834" y="147" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">3. 曝光与后处理链 (PostProcess)</text>
  <text x="1148" y="146" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#a855f7">成像阶段</text>
  <text x="834" y="179" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 线性 HDR SceneColor (物理亮度 cd/m²)</text>
  <text x="834" y="200" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• Auto Exposure 直方图测光适应 (EV100)</text>
  <text x="834" y="221" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• 卷积/FFT 泛光 (Bloom) &amp; 景深 (DOF)</text>
  <text x="834" y="242" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• Post Process Material (Before/After Tonemap)</text>
  <text x="834" y="263" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">  结合 CustomDepth + Stencil 实现轮廓描边</text>
  <text x="834" y="284" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">• ACES Filmic Tonemapper 映射至显示器 sRGB</text>

</svg>

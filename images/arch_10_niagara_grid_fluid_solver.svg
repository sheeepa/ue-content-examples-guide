<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1240" height="560" rx="16" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1208" height="528" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="54" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">Niagara Fluids 实时 GPU 流体力学解算管线：SWE 浅水波 × Navier-Stokes 气云 × FLIP 液体</text>
  <text x="40" y="80" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14" fill="#94a3b8">基于 Simulation Stages 多阶段 Compute Shader 与交错 MAC 网格（Marker-and-Cell Staggered Grid）的白盒物理求解器</text>
  <line x1="40" y1="96" x2="1200" y2="96" stroke="#334155" stroke-width="1"/>

  <!-- Column 1: 2D Shallow Water -->
  <rect x="40" y="116" width="365" height="404" rx="10" fill="#1e293b" fill-opacity="0.95" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="40" y="116" width="365" height="34" rx="10" fill="#38bdf8" fill-opacity="0.18"/>
  <text x="54" y="138" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14.5" font-weight="bold" fill="#f1f5f9">1. Grid2D Shallow Water (二维浅水波方程)</text>
  <text x="392" y="138" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">O(N²) 极速交互水面</text>

  <rect x="56" y="164" width="333" height="62" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="68" y="185" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#7dd3fc">① 地形河床采样 &amp; 刚体排开注入</text>
  <text x="68" y="206" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">读取 Landscape 深度 b(x,y) 与 Collide_Meshes 排水体积</text>

  <line x1="222" y1="226" x2="222" y2="244" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <rect x="56" y="248" width="333" height="80" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="68" y="269" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#7dd3fc">② 圣维南守恒律 (Height &amp; Flux Update)</text>
  <text x="68" y="290" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• 质量守恒：∂h/∂t + ∇·(h u) = 0</text>
  <text x="68" y="311" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• 动量守恒：重力水压梯度 -g h ∇(h + b) 驱动行波扩散</text>

  <line x1="222" y1="328" x2="222" y2="346" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <rect x="56" y="350" width="333" height="74" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="68" y="371" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#7dd3fc">③ 导出多通道 RenderTarget 驱动水面材质</text>
  <text x="68" y="392" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">SimRT (水位高度 WPO) + NormalRT (中心差分法线)</text>
  <text x="68" y="411" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">+ FoamRT (波峰速度散度/曲率生成白沫贴图)</text>

  <text x="56" y="452" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">代表资产：2DShallowWaterWake (64² 网格覆盖 20m×20m)</text>
  <text x="56" y="474" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">适用场景：船只 V 字尾迹、涉水涟漪、雨滴水坑交互</text>
  <text x="56" y="496" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#38bdf8">优势：零粒子开销、固定显存预算、极低帧耗时</text>

  <!-- Column 2: 2D/3D Gas Navier-Stokes -->
  <rect x="428" y="116" width="384" height="404" rx="10" fill="#1e293b" fill-opacity="0.95" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="428" y="116" width="384" height="34" rx="10" fill="#f59e0b" fill-opacity="0.18"/>
  <text x="442" y="138" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14.5" font-weight="bold" fill="#f1f5f9">2. Grid2D / Grid3D Gas (欧拉烟火气云解算器)</text>
  <text x="798" y="138" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">不可压缩 N-S 方程</text>

  <rect x="444" y="164" width="352" height="54" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="456" y="184" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#fcd34d">① 源注入 Splatting (Particle / Mesh / NDC)</text>
  <text x="456" y="204" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">向体素写入密度 Density、温度 Temp、RGB 色度与初速度</text>

  <line x1="620" y1="218" x2="620" y2="234" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="444" y="238" width="352" height="62" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="456" y="258" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#fcd34d">② 半拉格朗日平流 + 热浮力 + 涡量限制</text>
  <text x="456" y="278" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• 逆向回溯采样 u(x - uΔt) 消除爆炸发散</text>
  <text x="456" y="294" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">• 浮力 αT - βρ 升腾 + Vorticity N×ω 补偿蘑菇云卷曲细节</text>

  <line x1="620" y1="300" x2="620" y2="316" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="444" y="320" width="352" height="72" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="456" y="340" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#fcd34d">③ 压力泊松投影去散度 (Pressure Projection)</text>
  <text x="456" y="360" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">多轮 Jacobi / 红黑高斯-赛德尔迭代求解 ∇²p = (ρ/Δt)∇·u*</text>
  <text x="456" y="379" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">减去压力梯度 u = u* - (Δt/ρ)∇p 严格强制无散场 ∇·u = 0！</text>

  <line x1="620" y1="392" x2="620" y2="408" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="444" y="412" width="352" height="54" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
  <text x="456" y="432" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#fcd34d">④ 异质体积光线步进 (Heterogeneous Volumes)</text>
  <text x="456" y="452" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Beer-Lambert 消光自阴影 + 黑体辐射发光色温映射</text>

  <text x="444" y="494" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#f59e0b">代表资产：3DGasExplosion / 3DGasFire / 3DGasLitSmoke</text>

  <!-- Column 3: 3D FLIP Liquid -->
  <rect x="835" y="116" width="365" height="404" rx="10" fill="#1e293b" fill-opacity="0.95" stroke="#10b981" stroke-width="1.8"/>
  <rect x="835" y="116" width="365" height="34" rx="10" fill="#10b981" fill-opacity="0.18"/>
  <text x="849" y="138" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="14.5" font-weight="bold" fill="#f1f5f9">3. PIC / FLIP Liquid (混合拉格朗日-欧拉水体)</text>
  <text x="1186" y="138" text-anchor="end" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#10b981">飞溅浪花 + 等值面</text>

  <rect x="851" y="164" width="333" height="56" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="863" y="184" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#6ee7b7">① P2G (Particle-to-Grid 动量转移)</text>
  <text x="863" y="204" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">每格约 8 颗粒子将质量与动量核函数权重光栅化至 MAC 网格</text>

  <line x1="1017" y1="220" x2="1017" y2="236" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  <rect x="851" y="240" width="333" height="62" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="863" y="260" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#6ee7b7">② 欧拉网格重力、SDF 固壁边界与压力求解</text>
  <text x="863" y="280" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">自由液面 p=0 狄利克雷条件 + 150~200 轮压力投影防坍缩</text>
  <text x="863" y="296" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">支持 Mesh SDF / PhysicsAsset / Landscape / Chaos 碰撞</text>

  <line x1="1017" y1="302" x2="1017" y2="318" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  <rect x="851" y="322" width="333" height="62" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="863" y="342" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#6ee7b7">③ G2P 速度增量回传 (FLIP vs PIC 混合)</text>
  <text x="863" y="362" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">FLIP 叠加网格速度差 Δu 保留狂暴湍流与飞溅水珠能量；</text>
  <text x="863" y="378" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">混入约 5% PIC 抑制次网格数值噪波，积分推进粒子位置</text>

  <line x1="1017" y1="384" x2="1017" y2="400" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  <rect x="851" y="404" width="333" height="62" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="863" y="424" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12.5" font-weight="bold" fill="#6ee7b7">④ 等值面网格化 Surfacing &amp; Whitewater</text>
  <text x="863" y="444" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">粒子球烘入 Level-Set SDF → 提取光滑折射水面网格</text>
  <text x="863" y="460" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">+ 湍流波峰自动催生次级白水泡沫粒子 (Spray/Foam)</text>

  <text x="851" y="494" font-family="'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif" font-size="12" fill="#10b981">代表资产：3DLiquidSurfacing / 3DLiquidPool / 3DLiquidRiver</text>
</svg>
